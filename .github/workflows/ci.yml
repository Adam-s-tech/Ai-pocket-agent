name: Release

# Builds the project and attaches the files to the published GitHub release.
# Packaging uses the giode CLI with giode.toml (manifest entries, Info.plist
# texts). Written by hand rather than by `giode ci`, because the on-device
# engine is built first; the secrets have the names giode ci's workflows use.
# RELEASING.md says where each file goes and how to set the secrets up.
#   - Android APK (arm64, Android 9+) for GitHub, which downloads the engine,
#     and a Google Play bundle (.aab) with the engine packaged in (Play doesn't
#     allow downloading native code). Signed with the release keystore when
#     ANDROID_KEYSTORE_BASE64 and GIODE_KEYSTORE_PASS are set, otherwise with
#     the debug key (which Play refuses)
#   - the on-device engine for Android (two CPU variants) and Linux, plus
#     engine-manifest.json, which GitHub installs check at launch to download
#     the engine and its updates
#   - iOS/iPadOS .ipa for the App Store with the engine compiled in, signed
#     when IOS_CERT_BASE64, IOS_CERT_PASS and IOS_PROFILE_BASE64 are set (the
#     share extension also needs IOS_SHARE_PROFILE_BASE64), otherwise a
#     simulator build is attached instead
# Use three-part tags (v1.2.0): the build number (Android versionCode,
# CFBundleVersion) is then this workflow's run number, which every store
# upload needs raised. A four-part tag (v1.2.0.7) sets it explicitly.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gio dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - run: go vet ./...
      - run: go vet -tags devmock ./...
      - run: go test ./...
      - run: go build ./...
      - name: Cross-compile (Windows)
        run: GOOS=windows go build ./...

  engine:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: android
            variant: armv8.2
          - target: android
            variant: armv8
          - target: linux
            variant: ''
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android'
        with:
          packages: 'ndk;27.0.12077973'
      - name: Point the build at the NDK
        if: matrix.target == 'android'
        run: echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Cache the engine
        id: cache
        uses: actions/cache@v4
        with:
          path: build/engine
          key: engine-${{ matrix.target }}-${{ matrix.variant }}-${{ hashFiles('engine/**', 'scripts/llama-src.sh', 'scripts/build-engine.sh') }}
      - name: Build the engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-engine.sh ${{ matrix.target }} ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}-${{ matrix.variant }}
          path: build/engine/libpocketllama-*
          if-no-files-found: error

  android:
    needs: [test, engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'
      - name: Install the giode CLI
        run: go install github.com/xmhrnx/giode-cli/cmd/giode@v0.1.35-alpha.1
      - name: Use the release tag as the app version
        run: |
          TAG_VERSION=$(echo "${{ github.ref_name }}" | sed -E 's/^v//')
          if echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          elif echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION=$TAG_VERSION.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
      - name: Point the build at the Android SDK and NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Engine builds for the Play bundle
        uses: actions/download-artifact@v4
        with:
          pattern: engine-android-*
          path: build/engine
          merge-multiple: true
      - name: Signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GIODE_KEYSTORE_PASS: ${{ secrets.GIODE_KEYSTORE_PASS }}
        run: |
          # android.keystore in giode.toml; signed when the repository has it.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$GIODE_KEYSTORE_PASS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "SIGNKEY=release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          SIGNPASS: ${{ secrets.GIODE_KEYSTORE_PASS }}
        run: make android SIGNKEY="$SIGNKEY" SIGNPASS="$SIGNPASS"
      - name: Build the Google Play bundle
        env:
          SIGNPASS: ${{ secrets.GIODE_KEYSTORE_PASS }}
        run: make aab SIGNKEY="$SIGNKEY" SIGNPASS="$SIGNPASS"
      - name: Upload APK and bundle
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/pocket-agent.apk
            build/pocket-agent.aab
            build/native-debug-symbols.zip
          if-no-files-found: warn

  ios:
    needs: test
    runs-on: macos-latest
    # A hung signing step fails in an hour rather than GitHub's six.
    timeout-minutes: 60
    env:
      IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the giode CLI
        run: go install github.com/xmhrnx/giode-cli/cmd/giode@v0.1.35-alpha.1
      - name: Use the release tag as the app version
        run: |
          TAG_VERSION=$(echo "${{ github.ref_name }}" | sed -E 's/^v//')
          if echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          elif echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION=$TAG_VERSION.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
      - name: Signing certificate and profiles
        id: signing
        if: env.IOS_CERT_BASE64 != '' && env.IOS_PROFILE_BASE64 != ''
        env:
          IOS_CERT_PASS: ${{ secrets.IOS_CERT_PASS }}
        run: |
          echo "$IOS_CERT_BASE64" | base64 -d > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          echo "$IOS_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          # app.share_target: the share extension has its own profile; without
          # it the app is built without the share extension.
          if [ -n "$IOS_SHARE_PROFILE_BASE64" ]; then
            echo "$IOS_SHARE_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/share.mobileprovision"
          else
            echo "::warning::No IOS_SHARE_PROFILE_BASE64: the iOS app is built without its share extension"
          fi
          echo "has=true" >> "$GITHUB_OUTPUT"
      - name: Build the on-device engine (llama.cpp)
        if: steps.signing.outputs.has == 'true'
        run: scripts/build-llama.sh ios
      - name: Build iOS/iPadOS .ipa (signed)
        if: steps.signing.outputs.has == 'true'
        env:
          LLAMA: 1
          GIODE_IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          SHARE=""
          [ -f "$RUNNER_TEMP/share.mobileprovision" ] && SHARE="$RUNNER_TEMP/share.mobileprovision"
          make ios SIGNKEY="$RUNNER_TEMP/app.mobileprovision" SHAREKEY="$SHARE"
      - name: Build iOS simulator app
        if: steps.signing.outputs.has != 'true'
        run: make ios-sim
      - name: Package simulator app
        if: steps.signing.outputs.has != 'true'
        run: ditto -c -k --sequesterRsrc --keepParent build/PocketAgent.app build/PocketAgent-simulator.zip
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            build/PocketAgent.ipa
            build/PocketAgent-simulator.zip
          if-no-files-found: warn

  release:
    needs: [engine, android, ios]
    # Attach whatever built, so one failing platform doesn't block the other.
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Write the engine manifest
        if: needs.engine.result == 'success'
        run: |
          mkdir -p build/engine
          cp release-files/libpocketllama-* build/engine/
          scripts/engine-manifest.sh "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" > release-files/engine-manifest.json
          cat release-files/engine-manifest.json
      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
